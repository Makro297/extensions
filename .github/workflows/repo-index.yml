name: Build Mihon extension repo

on:
  push:
    branches: [repo]
    paths:
      - 'repo/apk/**.apk'
      - '.github/workflows/repo-index.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      # Dùng build-tools 33.0.2 để có aapt (bản 34 đôi khi thiếu aapt)
      - name: Install Build-Tools (aapt)
        shell: bash
        run: |
          sdkmanager --install "build-tools;33.0.2"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH
          echo "AAPT=$ANDROID_HOME/build-tools/33.0.2/aapt" >> $GITHUB_ENV
          $ANDROID_HOME/build-tools/33.0.2/aapt version

      - name: Install Python deps (Pillow for icon ops)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow brotli

      - name: Download Extensions Inspector (latest release)
        shell: bash
        run: |
          url=$(curl -s https://api.github.com/repos/keiyoushi/extensions-inspector/releases/latest \
            | jq -r '.assets[] | select(.name | test(".*\\.jar$")) | .browser_download_url' | head -n1)
          echo "Downloading: $url"
          curl -L "$url" -o Inspector.jar
          test -s Inspector.jar

      - name: Download create-repo.py (index generator)
        run: |
          curl -L -o create-repo.py \
            https://raw.githubusercontent.com/keiyoushi/extensions-source/main/.github/scripts/create-repo.py

      - name: Prepare folders
        shell: bash
        run: |
          mkdir -p repo/icon repo/.inspector-tmp
          ls -la repo/apk || true
          # Nếu không có APK thì thoát nhẹ
          shopt -s nullglob
          APKS=(repo/apk/*.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "No APKs in repo/apk, exiting gracefully."
            exit 0
          fi

      # FIX: dùng positional args <apks_dir> <output_json> <tmp_dir>
      - name: Inspect APKs -> repo/output.json
        shell: bash
        run: |
          set -euo pipefail
          java -jar Inspector.jar repo/apk repo/output.json repo/.inspector-tmp
          test -s repo/output.json
          echo "Inspector OK"

      - name: Generate index.min.json + icons
        env:
          AAPT: ${{ env.AAPT }}
        run: |
          python3 create-repo.py
          test -s repo/index.min.json
          ls -la repo/icon || true

      - name: Commit & push changes
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/index.min.json repo/icon/*.png || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(repo): update index.min.json & icons"
            git push
          fi
