# .github/workflows/build-index.yml
name: Build Mihon repo index

on:
  push:
    branches: [ repo ]   # dùng branch "repo" như Keiyoushi
    paths:
      - 'apk/**'
      - 'repo.json'
      - '.github/workflows/build-index.yml'
  workflow_dispatch: {}

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo branch
        uses: actions/checkout@v4
        with:
          ref: repo          # đảm bảo đang ở branch "repo"
          fetch-depth: 0

      - name: Ensure dirs & detect APKs
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apk icon
          shopt -s nullglob
          apks=(apk/*.apk apk/*/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "❌ Không tìm thấy APK trong ./apk"
            echo "has_apks=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Tìm thấy ${#apks[@]} APK:"
            printf '%s\n' "${apks[@]}"
            echo "has_apks=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 17
        if: steps.prep.outputs.has_apks == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download Inspector.jar (v1.4.8)
        if: steps.prep.outputs.has_apks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f Inspector.jar ]]; then
            echo "Inspector.jar đã có sẵn."
          else
            curl -fsSL -o Inspector.jar \
              https://github.com/keiyoushi/extensions-inspector/releases/download/v1.4.8/Inspector.jar
          fi

      - name: Inspect APKs -> output.json
        if: steps.prep.outputs.has_apks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          # CÚ PHÁP ĐÚNG: <apks_dir> <output_json> <tmp_dir>
          java -jar Inspector.jar apk output.json "$tmpdir"
          test -s output.json

      - name: Set up Python
        if: steps.prep.outputs.has_apks == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Get create-repo.py & deps
        if: steps.prep.outputs.has_apks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          if [[ ! -f .github/scripts/create-repo.py ]]; then
            curl -fsSL -o .github/scripts/create-repo.py \
              https://raw.githubusercontent.com/keiyoushi/extensions-source/main/.github/scripts/create-repo.py
          fi
          chmod +x .github/scripts/create-repo.py
          python -m pip install --upgrade pip
          pip install Pillow packaging

      - name: Locate aapt from Android SDK
        if: steps.prep.outputs.has_apks == 'true'
        id: aapt
        shell: bash
        run: |
          set -euo pipefail
          root="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          latest="$(ls -1 "$root/build-tools" | sort -V | tail -n 1)"
          aapt="$root/build-tools/$latest/aapt"
          if [[ ! -x "$aapt" ]]; then
            echo "Không tìm thấy aapt trong $root/build-tools"; ls -la "$root/build-tools" || true
            exit 1
          fi
          echo "aapt=$aapt" >> "$GITHUB_OUTPUT"

      - name: Build index.json / index.min.json / icons
        if: steps.prep.outputs.has_apks == 'true'
        env:
          AAPT: ${{ steps.aapt.outputs.aapt }}
        shell: bash
        run: |
          set -euo pipefail
          # Script upstream tự đọc output.json, repo.json, và sinh file index + icons ở root
          python .github/scripts/create-repo.py

      - name: Commit & push changes
        if: steps.prep.outputs.has_apks == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(repo): update index & icons"
          file_pattern: |
            index.json
            index.min.json
            index.html
            repo.json
            icon/**
