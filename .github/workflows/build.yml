name: Build Mihon extension repo

on:
  push:
    branches: [repo]
    paths:
      - 'repo/apk/**'                  # bắt mọi thay đổi trong thư mục apk
      - '.github/workflows/repo-index.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-index
  cancel-in-progress: true

jobs:
  build-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3.2.2

      # aapt (build-tools 33.0.2 ổn định)
      - name: Install Build-Tools (aapt)
        shell: bash
        run: |
          sdkmanager --install "build-tools;33.0.2"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> $GITHUB_PATH
          echo "AAPT=$ANDROID_HOME/build-tools/33.0.2/aapt" >> $GITHUB_ENV
          $ANDROID_HOME/build-tools/33.0.2/aapt version

      - name: Install Python deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow brotli

      - name: Download Extensions Inspector (latest)
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          url=$(curl -s https://api.github.com/repos/keiyoushi/extensions-inspector/releases/latest \
            | jq -r '.assets[] | select(.name | test(".*\\.jar$")) | .browser_download_url' | head -n1)
          echo "Downloading: $url"
          curl -L "$url" -o Inspector.jar
          test -s Inspector.jar

      - name: Download create-repo.py
        run: |
          curl -L -o create-repo.py \
            https://raw.githubusercontent.com/keiyoushi/extensions-source/main/.github/scripts/create-repo.py

      - name: Prepare folders & check APKs
        id: apks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo/apk repo/icon repo/.inspector-tmp
          echo "Tree:"
          ls -la repo || true
          ls -la repo/apk || true

          shopt -s nullglob
          files=(repo/apk/*.apk)
          if (( ${#files[@]} > 0 )); then
            echo "found APKs:"
            printf '%s\n' "${files[@]}"
            echo "has_apks=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APKs found in repo/apk"
            echo "has_apks=false" >> "$GITHUB_OUTPUT"
          fi

      # Chỉ chạy nếu có APK
      - name: Inspect APKs -> repo/output.json
        if: steps.apks.outputs.has_apks == 'true'
        shell: bash
        run: |
          set -euo pipefail
          java -jar Inspector.jar repo/apk repo/output.json repo/.inspector-tmp
          test -s repo/output.json
          echo "Inspector OK"

      - name: Generate index.min.json + icons
        if: steps.apks.outputs.has_apks == 'true'
        env:
          AAPT: ${{ env.AAPT }}
        run: |
          python3 create-repo.py
          test -s repo/index.min.json
          ls -la repo/icon || true

      - name: Commit & push changes
        if: steps.apks.outputs.has_apks == 'true'
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo/index.min.json repo/icon/*.png || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(repo): update index.min.json & icons"
            git push
          fi

      - name: Done (no APKs)
        if: steps.apks.outputs.has_apks != 'true'
        run: echo "Skip build: no APKs in repo/apk"
